services:
  db:
    image: mariadb:10.11
    container_name: wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_secure_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password"]
      interval: 5s
      timeout: 5s
      retries: 15

  wordpress:
    image: wordpress:latest
    container_name: wp_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_secure_password
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_HOST'])) {
            $$raw_host = strtolower($$_SERVER['HTTP_HOST']);
            $$http_scheme = (!empty($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] !== 'off') ? 'https://' : 'http://';
            define('WP_HOME', $$http_scheme . $$raw_host);
            define('WP_SITEURL', $$http_scheme . $$raw_host);
        }
        define('ALLOW_UNFILTERED_UPLOADS', true);
        define('GRAYWOOD_NAS_STORAGE', '/mnt/nas_deliveries');
        define('MYSQL_CLIENT_FLAGS', 0);
    volumes:
      - wp_data:/var/www/html
      - ./wp-theme/graywood-theme:/var/www/html/wp-content/themes/graywood-theme
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - nas_storage:/mnt/nas_deliveries

  wp-auto-install:
    image: wordpress:cli
    container_name: wp_cli_installer
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_secure_password
      WORDPRESS_CONFIG_EXTRA: |
        define('MYSQL_CLIENT_FLAGS', 0);
        define('GRAYWOOD_NAS_STORAGE', '/mnt/nas_deliveries');
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
      - ./wp-theme/graywood-theme:/var/www/html/wp-content/themes/graywood-theme
      - ./setup-wp.sh:/setup-wp.sh
    entrypoint: ["/bin/sh", "/setup-wp.sh"]

volumes:
  db_data:
  wp_data:
  nas_storage:
