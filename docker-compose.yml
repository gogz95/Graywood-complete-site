# =============================================================================
# Graywood WordPress Block Theme — Docker Compose
# MariaDB 10.11 + WordPress (latest) + WP-CLI auto-provisioner
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Database: MariaDB 10.11 with persistent storage
  # ---------------------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: graywood-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: GraywoodRoot2026!
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: WpGraywood2026!
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # WordPress: Latest with Apache, exposed on port 8080
  # ---------------------------------------------------------------------------
  wordpress:
    image: wordpress:latest
    container_name: graywood-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: WpGraywood2026!
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-theme/graywood-theme:/var/www/html/wp-content/themes/graywood-theme

  # ---------------------------------------------------------------------------
  # WP-CLI Auto-Installer: One-shot provisioning container
  # ---------------------------------------------------------------------------
  wp-auto-install:
    image: wordpress:cli
    container_name: graywood-wp-cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: WpGraywood2026!
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./setup-wp.sh:/usr/local/bin/setup-wp.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/setup-wp.sh"]

volumes:
  db_data:
  wp_data:
